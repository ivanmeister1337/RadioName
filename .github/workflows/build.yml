name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: List build outputs (diagnostic)
        if: always()
        run: |
          echo "=== Searching for any .apk files ==="
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null || echo "No APK files found anywhere"
          echo "=== Contents of app/build/outputs (if exists) ==="
          find app/build/outputs -type f 2>/dev/null || echo "app/build/outputs does not exist"
          echo "=== Keystore check ==="
          ls -la keystore/ 2>/dev/null || echo "keystore/ directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioNameHook-debug
          path: app/build/outputs/apk/debug/*.apk
