plugins {
    id 'com.android.application'
}

android {
    namespace 'com.belgee.radionamehook'
    compileSdk 33

    signingConfigs {
        release {
            storeFile file("${rootDir}/keystore/release.keystore")
            storePassword "radioimena123"
            keyAlias "radioimena"
            keyPassword "radioimena123"
        }
    }

    defaultConfig {
        applicationId "com.belgee.radionamehook"
        minSdk 26
        targetSdk 33
        versionCode 3
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            // Используем тот же ключ что и release — иначе обновление
            // debug-сборки поверх старой потребует удаления (разные подписи)
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "RadioImena-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // Xposed API стабы из локального модуля - не пойдут в APK благодаря compileOnly.
    // В runtime LSPosed подменяет на реальные классы.
    compileOnly project(':xposed-stub')
}
